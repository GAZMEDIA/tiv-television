plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Settings you may want to change
// ---------------------------------------------------------------------------
// Page the app reads the current stream link (and optional schedule) from.
def CONFIG_URL = "https://gazgoc.com.ng/tiv-app-link/"
// Used only when the link page can't be reached and no link was saved before.
def FALLBACK_STREAM = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
// ---------------------------------------------------------------------------

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as Integer

android {
    namespace 'com.tivtelevision.live'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tivtelevision.live'
        minSdk 21
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "CONFIG_URL", "\"${CONFIG_URL}\""
        buildConfigField "String", "FALLBACK_STREAM", "\"${FALLBACK_STREAM}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // A real release key can be supplied through GitHub secrets (see README).
        // Without it, the development key in this folder is used so that every
        // build can be installed over the previous one.
        tiv {
            def ks = System.getenv("TIV_KEYSTORE_FILE")
            storeFile ks ? file(ks) : file("tiv-dev.keystore")
            storePassword System.getenv("TIV_KEYSTORE_PASSWORD") ?: "tivdev123"
            keyAlias System.getenv("TIV_KEY_ALIAS") ?: "tiv"
            keyPassword System.getenv("TIV_KEY_PASSWORD") ?: "tivdev123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tiv
        }
        debug {
            signingConfig signingConfigs.tiv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
