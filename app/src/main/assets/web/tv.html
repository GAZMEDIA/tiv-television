video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:transparent}
video.on{background:#000}
.standby{position:fixed;left:0;right:0;top:42vh;text-align:center;font-size:3vh;color:#ddd;z-index:4}

/* Sizes use vh so the layout scales from 720p to 4K screens */
.bug{position:fixed;top:4.5vh;right:3.5vw;width:7vh;height:7vh;border-radius:50%;overflow:hidden;opacity:.8;box-shadow:0 0 0 .25vh rgba(255,255,255,.8);z-index:5}
.bug img{width:100%;height:100%;object-fit:cover}

.layer{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s}
.layer.show{opacity:1;pointer-events:auto}

/* Info bar */
.info{background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.92) 100%)}
.panel{position:absolute;left:3.5vw;right:3.5vw;bottom:5vh}
.anger{height:1.4vh;margin-bottom:2.8vh;background:repeating-linear-gradient(90deg,#fff 0 2.2vh,#000 2.2vh 2.6vh,#fff 2.6vh 3vh,#000 3vh 3.4vh,#fff 3.4vh 5.6vh,#000 5.6vh 8vh)}
.row{display:flex;align-items:center;gap:2.6vw}
.logo{width:13vh;height:13vh;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .4vh #fff;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.what{flex:1;min-width:0}
.cap{display:flex;align-items:center;gap:1.4vh;font-size:2.4vh;color:var(--ash)}
.livetag{display:inline-flex;align-items:center;gap:.8vh;background:var(--live);color:#fff;font-weight:800;padding:.5vh 1.2vh;border-radius:.4vh}
.livetag i{width:1vh;height:1vh;border-radius:50%;background:#fff}
.what h1{font-size:6.6vh;font-weight:900;font-stretch:120%;line-height:1;margin-top:1vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what p{font-size:2.6vh;color:#d8d8d8;margin-top:1vh}
.track{height:.8vh;background:#333;border-radius:.4vh;margin-top:2vh;overflow:hidden}
.track i{display:block;height:100%;background:#fff;width:0}
.times{display:flex;justify-content:space-between;font-size:2.1vh;color:var(--ash);margin-top:.9vh;font-variant-numeric:tabular-nums}
.next{flex:none;width:30vw;border-left:.3vh solid #444;padding-left:2.4vw}
.next small{font-size:2.2vh;color:var(--ash)}
.next b{display:block;font-size:3.4vh;font-weight:800;margin-top:.6vh}
.next span{display:block;font-size:2.4vh;color:var(--ash);margin-top:.6vh;font-variant-numeric:tabular-nums}

.menu{display:flex;gap:1.6vw;margin-top:3vh}
.btn{background:rgba(255,255,255,.08);border:.3vh solid rgba(255,255,255,.25);color:#fff;font:inherit;font-size:2.6vh;font-weight:700;padding:1.4vh 2.6vh;border-radius:99vh;transition:transform .15s,background .15s}
.btn.focus{background:#fff;color:#000;border-color:#fff;transform:scale(1.06)}
.hint{position:absolute;left:3.5vw;top:4.5vh;font-size:2.1vh;color:var(--ash);line-height:1.5}

/* Schedule */
.guide{background:rgba(0,0,0,.9)}
.guide .wrap{position:absolute;inset:7vh 3.5vw 6vh}
.guide h2{font-size:5.4vh;font-weight:900;font-stretch:118%}
.guide .day{font-size:2.4vh;color:var(--ash);margin-top:.8vh}
.slots{display:flex;gap:1.4vw;margin-top:5vh;overflow:hidden;scroll-behavior:smooth}
.slot{flex:none;width:21vw;min-height:34vh;background:var(--graphite);border:.3vh solid #2c2c2c;border-radius:.6vh;padding:2.6vh 2.4vh;display:flex;flex-direction:column;transition:transform .15s}
.slot time{font-size:2.6vh;color:var(--ash);font-variant-numeric:tabular-nums}
.slot b{font-size:3.6vh;font-weight:900;font-stretch:112%;line-height:1.05;margin-top:1.4vh}
.slot p{font-size:2.3vh;color:#cfcfcf;margin-top:1.4vh;line-height:1.35}
.slot em{margin-top:auto;font-style:normal;align-self:flex-start;font-size:2vh;font-weight:800;padding:.5vh 1.2vh;border:.25vh solid #555;border-radius:.4vh;color:var(--ash)}
.slot.past{opacity:.45}
.slot.now em{background:var(--live);border-color:var(--live);color:#fff}
.slot.focus{background:#fff;border-color:#fff;color:#000;transform:scale(1.04)}
.slot.focus time,.slot.focus p{color:#333}

const APP_CFG = (()=>{try{return window.TIVApp?JSON.parse(TIVApp.config()):{}}catch(e){return {}}})();
let STREAM_URL = APP_CFG.stream || "hls/live.m3u8";
const SCHEDULE = (Array.isArray(APP_CFG.schedule) && APP_CFG.schedule.length) ? APP_CFG.schedule : [ // placeholder programmes until TIV sends its real line-up
  { time:"06:00", title:"Morning Devotion", desc:"Prayer and worship to start the day.", tag:"Faith" },
  { time:"07:00", title:"Tiv News at Seven", desc:"The morning news in Tiv and English.", tag:"News" },
  { time:"09:00", title:"Farmers' Hour", desc:"Yam, rice and soybean farming across Benue.", tag:"Agriculture" },
  { time:"11:00", title:"Culture & Heritage", desc:"Kwagh-hir, swange dance and stories from the elders.", tag:"Culture" },
  { time:"13:00", title:"Afternoon Music", desc:"Tiv gospel, highlife and traditional songs.", tag:"Music" },
  { time:"16:00", title:"Youth Connect", desc:"Young Tiv voices on work, school and life.", tag:"Talk" },
  { time:"19:00", title:"Evening News", desc:"The day's headlines from Benue and beyond.", tag:"News" },
  { time:"20:00", title:"Tiv Movie Night", desc:"Feature films in the Tiv language.", tag:"Film" },
  { time:"23:00", title:"Night Replay", desc:"The best of today's programmes.", tag:"Replay" }
];
const INFO_SECONDS = 7;
/* ========================================================== */

const $=id=>document.getElementById(id);
const video=$('video'); let hls=null, levels=[], qIndex=-1, mode='start', menuIdx=0, slotIdx=0, hideT=null;

function msg(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>m.classList.remove('show'),2500)}

/* ---------- Player ---------- */
const OFF_AIR='TIV Television is off air right now. Please check back soon.';
function load(){
  if(STREAM_URL==='off'){ready=false;return}
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({liveSyncDurationCount:3,maxBufferLength:20});
    hls.loadSource(STREAM_URL); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{levels=d.levels||[];ready=true;if(mode!=='start')tryPlay()});
    hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){msg('Reconnecting to the channel…');if(window.TIVApp)TIVApp.refresh();setTimeout(()=>hls.startLoad(),3000)}
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();
      else msg('The channel is off air. Trying again…'),setTimeout(()=>{hls.destroy();load()},10000)});
  } else { video.src=STREAM_URL; ready=true; }
}
let ready=false;
function tryPlay(){
  video.muted=false;
  video.play().then(updateSound).catch(()=>{video.muted=true;video.play().catch(()=>{});updateSound()});
}
function begin(){
  $('start').classList.remove('show'); mode='watch';
  $('standby').textContent=STREAM_URL==='off'?OFF_AIR:'Tuning in to TIV Television…';
  if(ready) tryPlay();
  showInfo();
  setTimeout(()=>{ if(video.paused||!video.videoWidth) $('standby').textContent='The channel is not on air right now. It will start playing as soon as it is back.'; },12000);
}
video.addEventListener('playing',()=>{video.classList.add('on');$('standby').textContent=''});
function updateSound(){$('sBtn').textContent=video.muted?'Sound on':'Mute'}

/* ---------- Schedule data ---------- */
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function cur(){const n=new Date().getHours()*60+new Date().getMinutes();let c=SCHEDULE.length-1;SCHEDULE.forEach((s,i)=>{if(toMin(s.time)<=n)c=i});if(n<toMin(SCHEDULE[0].time))c=SCHEDULE.length-1;return{c,n}}
function renderInfo(){
  const{c,n}=cur(),s=SCHEDULE[c],x=SCHEDULE[(c+1)%SCHEDULE.length];
  let a=toMin(s.time),b=toMin(x.time);if(b<=a)b+=1440;let nn=n<a?n+1440:n;
  $('nowTitle').textContent=s.title;$('nowDesc').textContent=s.desc;
  $('progress').style.width=Math.max(0,Math.min(100,(nn-a)/(b-a)*100))+'%';
  $('tStart').textContent=s.time;$('tEnd').textContent=x.time;
  $('nextTitle').textContent=x.title;$('nextAt').textContent='at '+x.time;
}
function renderGuide(){
  const{c}=cur();
  $('day').textContent=new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long'})+' · West Africa Time';
  $('slots').innerHTML=SCHEDULE.map((s,i)=>`<div class="slot ${i<c?'past':''} ${i===c?'now':''}"><time>${s.time}</time><b>${s.title}</b><p>${s.desc}</p><em>${i===c?'On now':s.tag}</em></div>`).join('');
}
setInterval(renderInfo,30000);

/* ---------- Layers ---------- */
function showInfo(){
  renderInfo(); mode='info'; $('guide').classList.remove('show'); $('info').classList.add('show'); focusMenu();
  clearTimeout(hideT); hideT=setTimeout(hideAll,INFO_SECONDS*1000);
}
function hideAll(){ $('info').classList.remove('show'); $('guide').classList.remove('show'); mode='watch'; }
function openGuide(){
  renderGuide(); clearTimeout(hideT); $('info').classList.remove('show'); $('guide').classList.add('show'); mode='guide';
  slotIdx=cur().c; focusSlot();
}
function focusMenu(){[...$('menu').children].forEach((b,i)=>b.classList.toggle('focus',i===menuIdx))}
function focusSlot(){
  const els=[...$('slots').children]; els.forEach((e,i)=>e.classList.toggle('focus',i===slotIdx));
  const el=els[slotIdx]; if(el) $('slots').scrollLeft=Math.max(0,el.offsetLeft-$('slots').clientWidth*0.3);
}
function act(a){
  if(a==='guide') openGuide();
  if(a==='quality'){
    if(!hls||levels.length<2){msg('Only one picture quality is available');return}
    const opts=[-1,...levels.map((l,i)=>i).sort((x,y)=>levels[y].height-levels[x].height)];
    qIndex=opts[(opts.indexOf(qIndex)+1)%opts.length]; hls.currentLevel=qIndex;
    const label=qIndex===-1?'Auto':levels[qIndex].height+'p'; $('qBtn').textContent='Picture: '+label; msg('Picture quality: '+label); showInfo();
  }
  if(a==='sound'){video.muted=!video.muted;updateSound();msg(video.muted?'Sound off':'Sound on');showInfo()}
}

/* ---------- Remote control ---------- */
const BACK=['Escape','Backspace','GoBack','BrowserBack','XF86Back'];
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(mode==='start'){ if(k==='Enter'||k===' ') begin(); e.preventDefault(); return; }
  if(BACK.includes(k)){ if(mode!=='watch'){hideAll();e.preventDefault()} return; }
  if(mode==='watch'){
    if(k==='ArrowUp'||k==='ArrowDown'){openGuide()} else {showInfo()}
    e.preventDefault(); return;
  }
  if(mode==='info'){
    clearTimeout(hideT); hideT=setTimeout(hideAll,INFO_SECONDS*1000);
    const n=$('menu').children.length;
    if(k==='ArrowRight'){menuIdx=(menuIdx+1)%n;focusMenu()}
    else if(k==='ArrowLeft'){menuIdx=(menuIdx-1+n)%n;focusMenu()}
    else if(k==='ArrowUp'||k==='ArrowDown'){openGuide()}
    else if(k==='Enter'){act($('menu').children[menuIdx].dataset.act)}
    e.preventDefault(); return;
  }
  if(mode==='guide'){
    if(k==='ArrowRight'){slotIdx=Math.min(SCHEDULE.length-1,slotIdx+1);focusSlot()}
    else if(k==='ArrowLeft'){slotIdx=Math.max(0,slotIdx-1);focusSlot()}
    else if(k==='Enter'||k==='ArrowUp'||k==='ArrowDown'){hideAll()}
    e.preventDefault();
  }
});
/* Mouse or touch (TV browsers with a pointer remote) */
let mt; document.addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(mt);mt=setTimeout(()=>document.body.classList.remove('mouse'),3000)});
document.addEventListener('click',e=>{
  if(mode==='start'){begin();return}
  const b=e.target.closest('.btn'); if(b&&b.dataset.act){act(b.dataset.act);return}
  if(mode==='watch')showInfo(); else if(!e.target.closest('.panel,.slot'))hideAll();
});

load();

/* Called by the app: stream link changed / remote Back button */
window.tivSwitchStream=u=>{STREAM_URL=u;
  if(u==='off'){if(hls){hls.destroy();hls=null}video.removeAttribute('src');video.load();video.classList.remove('on');ready=false;if(mode!=='start')$('standby').textContent=OFF_AIR;return}
  if(hls){hls.loadSource(u);hls.startLoad()}else if(window.Hls&&Hls.isSupported()){load();if(mode!=='start')$('standby').textContent='Tuning in to TIV Television…'}else{video.src=u;ready=true;if(mode!=='start')tryPlay()}};
window.tivBack=()=>{if(mode==='info'||mode==='guide'){hideAll();return true}return false};

/* ===== Sponsors (TIV_SPONSOR lines on the link page): shown for 15 s every 3 minutes ===== */
(()=>{
  const list=Array.isArray(APP_CFG.sponsors)?APP_CFG.sponsors:[];
  if(!list.length)return;
  let i=0;
  const show=()=>{
    if(mode==='start')return;
    const sp=list[i%list.length];i++;
    $('sponsorText').textContent=sp.text||'';
    const img=$('sponsorImg'); if(sp.image){img.src=sp.image;img.hidden=false}else{img.hidden=true}
    $('sponsor').classList.add('show');
    setTimeout(()=>$('sponsor').classList.remove('show'),15000);
  };
  setTimeout(show,20000); setInterval(show,180000);
})();
</script>
</body>
</html>
