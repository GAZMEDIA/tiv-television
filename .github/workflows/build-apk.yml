name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.TIV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a permanent release key stored as repository secrets (see README).
      - name: Use release key from secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "TIV_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          TIV_KEYSTORE_PASSWORD: ${{ secrets.TIV_KEYSTORE_PASSWORD }}
          TIV_KEY_ALIAS: ${{ secrets.TIV_KEY_ALIAS }}
          TIV_KEY_PASSWORD: ${{ secrets.TIV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TIV-Television-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TIV-Television-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish as a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TIV Television 1.0.${{ github.run_number }}
          body: |
            Install on phones and Android TV. Download the .apk below.
            Built from ${{ github.sha }}.
          files: out/*.apk
